name: release

# Manual release flow:
#   1. Trigger via Actions tab -> "Run workflow" -> enter version (e.g. 0.0.1)
#      or via CLI: gh workflow run release.yml -f version=0.0.1
#   2. Workflow validates the version and pre-flight state (see Pre-flight
#      step), stamps version into plugin.json (in CI only), pushes an orphan
#      release branch with install-ready files, creates the
#      agent-godot-wrapper--v{version} tag on that commit, and publishes a
#      GitHub Release whose notes are generated from main's history (via
#      src/<TAG> marker tags -- see AGENTS.md) with the zip attached.
#   3. The workflow then notifies agent-marketplace directly via
#      ECOSYSTEM_TOKEN, forwarding the same notes as `changelog`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Everything lives in this one job -- not split into "stamp"/"assemble" --
  # so that $RUNNER_TEMP and steps.preflight.outputs.* reach every later
  # step without artifacts or job outputs. A split would need a fresh
  # checkout in the second job plus job-level outputs for no benefit.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read-only: validates the version (strict SemVer via
      # prev-release-tag.sh), proves HEAD is the default branch's tip (the
      # only pre-side-effect check that GITHUB_TOKEN is about to act on what
      # was actually approved), and refuses if the release tag or its source
      # marker already exists, or if the previous release's source marker is
      # missing (see AGENTS.md's one-time bootstrap). Replaces the old
      # "Validate version is semver" and "Fail if tag already exists" steps
      # with the same tight grammar prev-release-tag.sh enforces.
      - name: Pre-flight
        id: preflight
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          bash .github/scripts/release-preflight.sh "$PLUGIN_NAME" "${{ inputs.version }}"

          # "git checkout --orphan" + "git clean -fdx" below wipes the
          # worktree, including .github/scripts -- stash a copy outside it
          # now so the Dispatch step can still call marketplace-payload.sh.
          mkdir -p "$RUNNER_TEMP/release-scripts"
          cp -a .github/scripts/. "$RUNNER_TEMP/release-scripts/"

      - name: Stamp version into plugin manifests (in CI only)
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # Both plugin manifests (Claude + Codex) get the same version.
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            tmp=$(mktemp)
            jq --arg v "$V" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          echo "Stamped version $V"

      - name: Stage install tree and build release zip
        id: stage
        shell: bash
        run: |
          STAGE="build/stage/agent-godot-wrapper"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.claude-plugin" "$STAGE/.codex-plugin" "$STAGE/skills"
          cp .claude-plugin/plugin.json "$STAGE/.claude-plugin/"
          cp .codex-plugin/plugin.json  "$STAGE/.codex-plugin/"
          cp -a skills/. "$STAGE/skills/"
          # scripts/ (prepare-script, launchers) and hooks/ (hooks.json) are
          # install-ready content once they exist - modeled on
          # agent-unity-wrapper, where both ship on the release branch. Neither
          # exists yet; staging them conditionally means adding them later
          # needs no workflow change.
          [ -d scripts ] && cp -a scripts "$STAGE/" || true
          [ -d hooks ]   && cp -a hooks   "$STAGE/" || true
          cp README.md "$STAGE/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          # assets/ goes onto the orphan release branch so the dispatch
          # payload's icon URL (raw.githubusercontent.com/${repo}/${TAG}/
          # assets/icon.png) resolves.
          [ -d assets ] && cp -a assets "$STAGE/" || true
          # description.md ships onto the orphan release branch so the dispatch
          # payload's description_url resolves at the tagged commit.
          [ -f description.md ] && cp -a description.md "$STAGE/" || true

          mkdir -p dist
          ZIPNAME="agent-godot-wrapper-${{ inputs.version }}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/$ZIPNAME" .)

          echo "stage=$STAGE"      >> "$GITHUB_OUTPUT"
          echo "zip=dist/$ZIPNAME" >> "$GITHUB_OUTPUT"

      # First remote side effect of the run (unconditional, no exists-guard:
      # Pre-flight already proved the src/<TAG> marker is absent). This tags
      # the pristine main commit -- the orphan branch created below has no
      # ancestry back to it, so this tag is the only durable link from a
      # release to the history that produced it.
      - name: Push source marker tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          MAIN_SHA="${{ steps.preflight.outputs.main_sha }}"
          git push origin "${MAIN_SHA}:refs/tags/src/${TAG}"

      - name: Push orphan release branch and capture commit
        id: rel
        shell: bash
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          ZIP="${{ steps.stage.outputs.zip }}"
          if [ ! -d "$STAGE" ]; then
            echo "::error::staging dir $STAGE not produced"; exit 1
          fi
          if [ ! -f "$ZIP" ]; then
            echo "::error::release zip $ZIP not produced"
            ls -la dist/ || true
            exit 1
          fi

          # Stash staging tree AND the release zip outside the worktree, since
          # "git checkout --orphan" + clean will wipe dist/ before we attach
          # the zip to the GitHub Release.
          TMP=$(mktemp -d)
                    # .gitattributes MUST ship on the orphan release branch: Claude Code clones it,
          # and on a Windows machine with core.autocrlf=true (Git-for-Windows default)
          # a checkout without `* text=auto eol=lf` writes CRLF into the plugin cache —
          # and Claude Code silently ignores CRLF skills/agents. (Rebuild incident 2026-08-23.)
          for ga in .gitattributes stamped/.gitattributes; do
            if [ -f "$ga" ]; then cp -a "$ga" "$STAGE/"; break; fi
          done
          cp -a "$STAGE"/. "$TMP/"
          ASSET_DIR=$(mktemp -d)
          cp "$ZIP" "$ASSET_DIR/"
          echo "asset=$ASSET_DIR/$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan release
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true

          leftover=$(find . -mindepth 1 -maxdepth 1 -not -name '.git' || true)
          if [ -n "$leftover" ]; then
            echo "::error::working tree not empty after clean:"; echo "$leftover"; exit 1
          fi

          cp -a "$TMP"/. .

          echo "=== release branch contents ==="
          find . -mindepth 1 -not -path './.git*' | sort

          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push origin release --force

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # Notes are generated from main's history between src/<TAG> markers,
      # not from the orphan tag (which has no ancestry and would otherwise
      # yield an empty "Full Changelog" against only the release bot commit).
      - name: Generate release notes from main
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          MAIN_SHA="${{ steps.preflight.outputs.main_sha }}"
          PREV_TAG="${{ steps.preflight.outputs.prev_tag }}"

          ARGS=(-f "tag_name=src/${TAG}" -f "target_commitish=${MAIN_SHA}")
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(-f "previous_tag_name=src/${PREV_TAG}")
          fi

          gh api "repos/${{ github.repository }}/releases/generate-notes" "${ARGS[@]}" --jq .body \
            > "$RUNNER_TEMP/notes.md"

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          # --generate-notes and --notes-start-tag both walk ancestry from the
          # target commit; the orphan release commit has none, so notes are
          # generated separately (above, from main) and attached via
          # --notes-file instead.
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.rel.outputs.sha }}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            ${{ contains(inputs.version, '-') && '--prerelease' || '' }} \
            "${{ steps.rel.outputs.asset }}"

      # Tags created via GITHUB_TOKEN don't fire downstream push:tags workflows
      # (Actions blocks this to prevent recursive loops). Call the marketplace
      # directly with a separate PAT.
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT:  ${{ secrets.ECOSYSTEM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          TAG="${NAME}--v${VERSION}"
          REPO="${{ github.repository }}"

          # The sentinel ("&& printf x" / strip trailing "x") preserves a
          # genuine trailing newline in the release body through command
          # substitution, which would otherwise strip all trailing newlines.
          # This is the only trim applied anywhere in this pipeline --
          # marketplace-payload.sh below passes CHANGELOG through untouched.
          CHANGELOG=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body && printf x)
          CHANGELOG="${CHANGELOG%x}"
          CHANGELOG="${CHANGELOG%$'\n'}"

          PAYLOAD=$(NAME="$NAME" DESC="$DESC" REPO="$REPO" VERSION="$VERSION" TAG="$TAG" CHANGELOG="$CHANGELOG" \
            bash "$RUNNER_TEMP/release-scripts/marketplace-payload.sh")

          # Staging first (lands straight to main, no review), then the
          # curated marketplace (opens a review PR) -- same payload, two
          # independent dispatches.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory-staging/dispatches \
            -d "$PAYLOAD"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory/dispatches \
            -d "$PAYLOAD"
